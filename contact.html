    <div class="contact-wrap">
      <div class="social-row">

          GitHub

        <a href="https://linkedin.com/in/" target="_blank" class="social-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>

      <div class="contact-form">
        <p style="margin-bottom: 20px; font-weight: 600; font-size: 0.95rem;">Or send me a message directly:</p>
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Your name" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" placeholder="What's on your mind?"></textarea>
        </div>
        <div>
          <a href="#" class="btn btn-primary" onclick="handleSend(event)">Send Message</a>
        </div>
      </div>

<script src="main.js"></script>
<script>
function handleSend(e) {
  e.preventDefault();
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const msg = document.getElementById('message').value;
  if (!name || !email || !msg) { alert('Please fill in all fields.'); return; }
  window.location.href = `mailto:nabinpr777@gmail.com?subject=Portfolio Contact from ${encodeURIComponent(name)}&body=${encodeURIComponent(msg)}%0A%0AFrom: ${encodeURIComponent(email)}`;
}
</script>
